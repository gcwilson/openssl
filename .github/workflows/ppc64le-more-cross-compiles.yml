name: Cross Compile for POWER/ppc64le Extensions

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:
  schedule:
    - cron: '35 02 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-compilation-ppc64le:
    # pull request title contains 'ppc64le' or 'power'
    # pull request title contains 'POWER' or 'PPC64LE'
    # pull request body contains '[ppc64le ci]'
    # push event commit message contains '[ppc64le ci]'
    # cron job
    # manual dispatch
    if: contains(github.event.pull_request.title, 'ppc64le') || contains(github.event.pull_request.title, 'power') || contains(github.event.pull_request.title, 'POWER') || contains(github.event.pull_request.title, 'PPC64LE') || contains(github.event.pull_request.body, '[ppc64le ci]') || contains(github.event.head_commit.message, '[ppc64le ci]') || (github.event_name == 'schedule' && github.repository == 'openssl/openssl') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # The platform matrix specifies:
        #   arch: the architecture to build for, this defines the tool-chain
        #         prefix {arch}- and the Debian compiler package gcc-{arch}
        #         name.
        #   libs: the Debian package for the necessary link/runtime libraries.
        #   target: the OpenSSL configuration target to use, this is passed
        #           directly to the config command line.
        #   fips:   set to "no" to disable building FIPS, leave unset to
        #           build the FIPS provider.
        #   tests: omit this to run all the tests using QEMU, set it to "none"
        #          to never run the tests, otherwise its value is passed to
        #          the "make test" command to allow selective disabling of
        #          tests.
        #   qemucpu: optional; string that describes CPU properties.
        #            The string will be used to set the QEMU_CPU variable.
        #   opensslcapsname: optional; string that describes the postfix of the
        #                    OpenSSL environment variable that defines CPU
        #                    capabilities. E.g. "foo" will result in an
        #                    environment variable with the name OPENSSL_foo.
        #   opensslcaps: optional; if opensslcapsname (see above) is set, then
        #                this string will be used as content for the OpenSSL
        #                capabilities variable.
        #   ppa:   Launchpad PPA repository to download packages from.
        platform: [
          {
            # POWER8 baseline - conservative settings to avoid SIGILL
            # Capabilities: ALTIVEC + FPU (no CRYPTO207 to avoid SIGILL)
            # 0x02 + 0x08 = 0x0A
            # Tests basic vector operations without crypto extensions
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power8",
            opensslcapsname: ppccap,
            opensslcaps: "0x0A"
          }, {
            # POWER9 (ISA 3.00) - full capabilities
            # Capabilities: ALTIVEC + CRYPTO207 + FPU + MADD300 + MFSPR268
            # 0x02 + 0x04 + 0x08 + 0x10 + 0x40 = 0x5E
            # POWER9 in QEMU supports crypto extensions
            #   crypto/aes/asm/aesp8-ppc.pl (enhanced)
            #   crypto/sha/asm/sha512p8-ppc.pl (enhanced)
            #   crypto/modes/asm/ghashp8-ppc.pl
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power9",
            opensslcapsname: ppccap,
            opensslcaps: "0x5E"
          }, {
            # POWER10 (ISA 3.1) - full capabilities
            # Capabilities: ALTIVEC + CRYPTO207 + FPU + MADD300 + MFSPR268 + BRD31
            # 0x02 + 0x04 + 0x08 + 0x10 + 0x40 + 0x80 = 0xDE
            #   crypto/aes/asm/aesp8-ppc.pl (full optimization)
            #   crypto/sha/asm/sha512p8-ppc.pl (full optimization)
            #   crypto/modes/asm/ghashp8-ppc.pl (enhanced)
            #   crypto/chacha/asm/chacha-ppc.pl (ISA 3.1 optimizations)
            #   crypto/bn/asm/ppc-mont.pl
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power10",
            opensslcapsname: ppccap,
            opensslcaps: "0xDE"
          }, {
            # POWER9 with reduced capabilities - testing fallback paths
            # Capabilities: ALTIVEC + FPU + MADD300 (no CRYPTO207)
            # 0x02 + 0x08 + 0x10 = 0x1A
            # Tests software fallback when crypto extensions disabled
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power9",
            opensslcapsname: ppccap,
            opensslcaps: "0x1A"
          }, {
            # POWER9 with VSX disabled - testing scalar paths
            # Capabilities: CRYPTO207 + FPU + MADD300 + MFSPR268 (no ALTIVEC)
            # 0x04 + 0x08 + 0x10 + 0x40 = 0x5C
            # Tests scalar code paths without vector operations
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power9",
            opensslcapsname: ppccap,
            opensslcaps: "0x5C"
          }, {
            # POWER10 with reduced capabilities - testing ISA 3.1 specific paths
            # Capabilities: ALTIVEC + CRYPTO207 + FPU + MADD300 + BRD31 (no MFSPR268)
            # 0x02 + 0x04 + 0x08 + 0x10 + 0x80 = 0x9E
            # Tests POWER10-specific optimizations without some POWER9 features
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power10",
            opensslcapsname: ppccap,
            opensslcaps: "0x9E"
          }, {
            # POWER8 minimal - absolute minimum capabilities
            # Capabilities: FPU only (no vector, no crypto)
            # 0x08 = 0x08
            # Tests pure scalar fallback paths
            arch: powerpc64le-linux-gnu,
            libs: libc6-dev-ppc64el-cross,
            target: linux-ppc64le,
            fips: no,
            qemucpu: "power8",
            opensslcapsname: ppccap,
            opensslcaps: "0x08"
          }
        ]
    runs-on: ubuntu-latest
    steps:
    - name: install package repository
      if: matrix.platform.ppa != ''
      run: |
        sudo add-apt-repository ppa:${{ matrix.platform.ppa }}
    - name: install packages
      run: |
        sudo apt-get update
        sudo apt-get -yq --force-yes install \
            gcc-${{ matrix.platform.arch }} \
            ${{ matrix.platform.libs }} \
            qemu-user
    - uses: actions/checkout@v5
    - name: checkout fuzz/corpora submodule
      run: git submodule update --init --depth 1 fuzz/corpora
    - name: config
      run: |
        ./config --banner=Configured --strict-warnings \
            --cross-compile-prefix=${{ matrix.platform.arch }}- \
            ${{ matrix.platform.target }} \
            -static
    - name: config dump
      run: ./configdata.pm --dump
    - name: make
      run: make -s -j4
    - name: get cpu info
      run: |
        cat /proc/cpuinfo
        ./util/opensslwrap.sh version -c
    - name: Set QEMU environment
      if: matrix.platform.qemucpu != ''
      run: |
        echo "QEMU_CPU=${{ matrix.platform.qemucpu }}" >> $GITHUB_ENV
    - name: Set OpenSSL caps environment
      if: matrix.platform.opensslcapsname != ''
      run: |
        echo "OPENSSL_${{ matrix.platform.opensslcapsname }}=${{ matrix.platform.opensslcaps }}" >> $GITHUB_ENV
    - name: make test
      run: |
        make test HARNESS_JOBS=${HARNESS_JOBS:-4} \
                  ${{ matrix.platform.tests }}
